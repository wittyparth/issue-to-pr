[project]
name = "it2pr-worker"
version = "0.1.0"
description = "Ephemeral Fargate worker: env inference + agent loop + verification"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.9.0",
    "boto3>=1.35",
]

[project.scripts]
it2pr-worker = "it2pr_worker.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/it2pr_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
